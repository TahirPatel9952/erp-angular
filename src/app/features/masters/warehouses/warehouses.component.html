<p-toast />
<p-confirmDialog />

<div class="page-container">
  <div class="page-header">
    <h1>Warehouses</h1>
    <div class="header-actions">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input pInputText placeholder="Search..." [(ngModel)]="searchTerm" (input)="onSearch()" />
      </span>
      <button pButton label="Add Warehouse" icon="pi pi-plus" (click)="showDialog()"></button>
    </div>
  </div>

  <div class="card">
    <p-table
      [value]="warehouses()"
      [paginator]="true"
      [rows]="10"
      [loading]="loading()"
      [totalRecords]="totalRecords()"
      [lazy]="true"
      (onLazyLoad)="loadWarehouses($event)"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="code">Code <p-sortIcon field="code" /></th>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Location</th>
          <th>Contact Person</th>
          <th>Contact Phone</th>
          <th>Status</th>
          <th style="width: 120px">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-warehouse>
        <tr>
          <td><strong>{{ warehouse.code }}</strong></td>
          <td>{{ warehouse.name }}</td>
          <td>
            <div class="location-info">
              <span>{{ warehouse.city || '-' }}</span>
              @if (warehouse.state) {
                <small>, {{ warehouse.state }}</small>
              }
            </div>
          </td>
          <td>{{ warehouse.contactPerson || '-' }}</td>
          <td>{{ warehouse.contactPhone || '-' }}</td>
          <td>
            <p-tag
              [value]="warehouse.isActive ? 'Active' : 'Inactive'"
              [severity]="warehouse.isActive ? 'success' : 'danger'"
            />
          </td>
          <td>
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-text p-button-sm p-button-rounded"
                pTooltip="Edit"
                (click)="editWarehouse(warehouse)"
              ></button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-text p-button-sm p-button-rounded p-button-danger"
                pTooltip="Delete"
                (click)="confirmDelete(warehouse)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="empty-message">
            <i class="pi pi-building"></i>
            <p>No warehouses found</p>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Warehouse Dialog -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="editMode ? 'Edit Warehouse' : 'Add Warehouse'"
  [modal]="true"
  [style]="{ width: '600px' }"
  [draggable]="false"
  [resizable]="false"
>
  <form [formGroup]="warehouseForm" class="form-grid">
    <div class="form-field">
      <label for="code" class="required">Code</label>
      <input id="code" pInputText formControlName="code" class="w-full" placeholder="e.g., WH-001" />
    </div>

    <div class="form-field">
      <label for="name" class="required">Name</label>
      <input id="name" pInputText formControlName="name" class="w-full" placeholder="Warehouse name" />
    </div>

    <div class="form-field full-width">
      <label for="address">Address</label>
      <textarea
        id="address"
        pInputTextarea
        formControlName="address"
        rows="2"
        class="w-full"
        placeholder="Full address"
      ></textarea>
    </div>

    <div class="form-field">
      <label for="city">City</label>
      <input id="city" pInputText formControlName="city" class="w-full" />
    </div>

    <div class="form-field">
      <label for="state">State</label>
      <input id="state" pInputText formControlName="state" class="w-full" />
    </div>

    <div class="form-field">
      <label for="country">Country</label>
      <input id="country" pInputText formControlName="country" class="w-full" />
    </div>

    <div class="form-field">
      <label for="pincode">Pincode</label>
      <input id="pincode" pInputText formControlName="pincode" class="w-full" />
    </div>

    <div class="form-field">
      <label for="contactPerson">Contact Person</label>
      <input id="contactPerson" pInputText formControlName="contactPerson" class="w-full" />
    </div>

    <div class="form-field">
      <label for="contactPhone">Contact Phone</label>
      <input id="contactPhone" pInputText formControlName="contactPhone" class="w-full" />
    </div>

    <div class="form-field full-width">
      <label for="contactEmail">Contact Email</label>
      <input id="contactEmail" pInputText formControlName="contactEmail" type="email" class="w-full" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button pButton label="Cancel" class="p-button-text" icon="pi pi-times" (click)="closeDialog()"></button>
      <button
        pButton
        label="Save"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="warehouseForm.invalid"
        (click)="saveWarehouse()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
