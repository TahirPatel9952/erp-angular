<p-toast />
<p-confirmDialog />

<div class="page-container">
  <div class="page-header">
    <h1>Customers</h1>
    <div class="header-actions">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input pInputText placeholder="Search customers..." [(ngModel)]="searchTerm" (input)="onSearch()" />
      </span>
      <button pButton label="Add Customer" icon="pi pi-plus" (click)="showDialog()"></button>
    </div>
  </div>

  <div class="card">
    <p-table
      [value]="customers()"
      [paginator]="true"
      [rows]="10"
      [loading]="loading()"
      [totalRecords]="totalRecords()"
      [lazy]="true"
      (onLazyLoad)="loadCustomers($event)"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="code">Code <p-sortIcon field="code" /></th>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Type</th>
          <th>Contact</th>
          <th>City</th>
          <th>Credit Limit</th>
          <th>Status</th>
          <th style="width: 120px">Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-customer>
        <tr>
          <td><strong>{{ customer.code }}</strong></td>
          <td>{{ customer.name }}</td>
          <td><p-tag [value]="customer.customerType" severity="info" /></td>
          <td>
            <div class="contact-info">
              <span>{{ customer.contactPerson || '-' }}</span>
              @if (customer.phone) {
                <small>{{ customer.phone }}</small>
              }
            </div>
          </td>
          <td>{{ customer.billingCity || '-' }}</td>
          <td class="text-right">
            <span class="amount">₹{{ customer.creditLimit | number }}</span>
          </td>
          <td>
            <p-tag
              [value]="customer.isActive ? 'Active' : 'Inactive'"
              [severity]="customer.isActive ? 'success' : 'danger'"
            />
          </td>
          <td>
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-text p-button-sm p-button-rounded"
                pTooltip="Edit"
                (click)="editCustomer(customer)"
              ></button>
              <button
                pButton
                icon="pi pi-trash"
                class="p-button-text p-button-sm p-button-rounded p-button-danger"
                pTooltip="Delete"
                (click)="confirmDelete(customer)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8" class="empty-message">
            <i class="pi pi-users"></i>
            <p>No customers found</p>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Customer Dialog -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="editMode ? 'Edit Customer' : 'Add Customer'"
  [modal]="true"
  [style]="{ width: '750px' }"
  [draggable]="false"
  [resizable]="false"
>
  <p-tabView>
    <!-- Basic Info Tab -->
    <p-tabPanel header="Basic Info">
      <form [formGroup]="customerForm" class="form-grid">
        <div class="form-field">
          <label for="code" class="required">Code</label>
          <input id="code" pInputText formControlName="code" class="w-full" placeholder="CUS-001" />
        </div>

        <div class="form-field">
          <label for="name" class="required">Name</label>
          <input id="name" pInputText formControlName="name" class="w-full" />
        </div>

        <div class="form-field">
          <label for="customerType">Type</label>
          <p-dropdown
            id="customerType"
            formControlName="customerType"
            [options]="customerTypes"
            optionLabel="label"
            optionValue="value"
            class="w-full"
          />
        </div>

        <div class="form-field">
          <label for="contactPerson">Contact Person</label>
          <input id="contactPerson" pInputText formControlName="contactPerson" class="w-full" />
        </div>

        <div class="form-field">
          <label for="phone">Phone</label>
          <input id="phone" pInputText formControlName="phone" class="w-full" />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" pInputText formControlName="email" type="email" class="w-full" />
        </div>
      </form>
    </p-tabPanel>

    <!-- Billing Address Tab -->
    <p-tabPanel header="Billing Address">
      <form [formGroup]="customerForm" class="form-grid">
        <div class="form-field full-width">
          <label for="billingAddress">Address</label>
          <textarea id="billingAddress" pInputTextarea formControlName="billingAddress" rows="2" class="w-full"></textarea>
        </div>

        <div class="form-field">
          <label for="billingCity">City</label>
          <input id="billingCity" pInputText formControlName="billingCity" class="w-full" />
        </div>

        <div class="form-field">
          <label for="billingState">State</label>
          <input id="billingState" pInputText formControlName="billingState" class="w-full" />
        </div>

        <div class="form-field">
          <label for="billingCountry">Country</label>
          <input id="billingCountry" pInputText formControlName="billingCountry" class="w-full" />
        </div>

        <div class="form-field">
          <label for="billingPincode">Pincode</label>
          <input id="billingPincode" pInputText formControlName="billingPincode" class="w-full" />
        </div>
      </form>
    </p-tabPanel>

    <!-- Tax & Credit Tab -->
    <p-tabPanel header="Tax & Credit">
      <form [formGroup]="customerForm" class="form-grid">
        <div class="form-field">
          <label for="gstNo">GST No</label>
          <input id="gstNo" pInputText formControlName="gstNo" class="w-full" />
        </div>

        <div class="form-field">
          <label for="panNo">PAN No</label>
          <input id="panNo" pInputText formControlName="panNo" class="w-full" />
        </div>

        <div class="form-field">
          <label for="creditLimit">Credit Limit</label>
          <p-inputNumber
            id="creditLimit"
            formControlName="creditLimit"
            mode="currency"
            currency="INR"
            locale="en-IN"
            class="w-full"
          />
        </div>

        <div class="form-field">
          <label for="paymentTerms">Payment Terms (days)</label>
          <p-inputNumber id="paymentTerms" formControlName="paymentTerms" class="w-full" />
        </div>

        <div class="form-field">
          <label for="discountPercent">Discount %</label>
          <p-inputNumber id="discountPercent" formControlName="discountPercent" suffix="%" class="w-full" />
        </div>
      </form>
    </p-tabPanel>
  </p-tabView>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button pButton label="Cancel" class="p-button-text" icon="pi pi-times" (click)="closeDialog()"></button>
      <button
        pButton
        label="Save"
        icon="pi pi-check"
        [loading]="saving()"
        [disabled]="customerForm.invalid"
        (click)="saveCustomer()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
